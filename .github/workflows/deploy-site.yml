name: Deploy Site to Cloudflare Workers

on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      # astro build -> cf-wrangler build (Build Output) -> cf deploy --prebuilt
      - name: Build and deploy to Workers static assets
        run: npm run deploy -- --message "${GITHUB_SHA}"

      # The omarknows.app zone caches HTML at the edge; drop this host's copy.
      - name: Purge edge cache
        run: npx cf cache purge -z omarknows.app --body '{"hosts":["apple-pim.omarknows.app"]}' --force
