name: Publish to NPM

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  # Publishing is gated on the SDK actually shipping what the mail channel calls,
  # because the three publish workflows fire independently on the same tag. Without
  # this, a premature tag fails the two npm-installing workflows and SUCCEEDS on
  # Homebrew, which builds the Swift CLI from the source tarball and never touches
  # openclaw/. That leaves the tap pointing at a version npm and ClawHub never got,
  # which is worse than nothing publishing at all.
  preflight:
    name: SDK contract preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Probe the OpenClaw SDK contract
        id: sdk
        uses: ./.github/actions/openclaw-sdk-contract

      - name: Refuse to publish against an SDK without the contract
        if: steps.sdk.outputs.available != 'true'
        env:
          DETAIL: ${{ steps.sdk.outputs.detail }}
        run: |
          echo "::error::$DETAIL"
          {
            echo "### Publish blocked"
            echo ""
            echo "\`openclaw/src/mail-channel/inbound.ts\` calls the channel-ingress"
            echo "identifier-authentication contract, and no installable SDK ships it yet."
            echo ""
            echo "> $DETAIL"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Report
        if: steps.sdk.outputs.available == 'true'
        env:
          DETAIL: ${{ steps.sdk.outputs.detail }}
        run: echo "::notice::$DETAIL"

  publish:
    name: Publish apple-pim-cli to NPM
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        # Node 24 ships with npm 11.x. Trusted Publisher OIDC requires
        # npm >= 11.5.1 (per https://docs.npmjs.com/trusted-publishers).
        # Node 22's bundled npm 10.9.x silently 404s on the publish PUT
        # despite signed provenance landing in sigstore — that was the
        # cause of every failed CI publish since the OIDC migration.
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Print npm version
        run: npm --version

      - name: Assert tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi
        working-directory: openclaw

      - name: Install + build (compile TS so publish has dist/)
        run: |
          cd openclaw
          npm install --force
          npm run build

      - name: Publish to NPM (OIDC trusted publishing)
        run: npm publish --provenance --access public
        working-directory: openclaw

      # npm answers `publish` before the version is queryable, and prints
      # "Your package is being processed and may take a few minutes to become
      # available" saying so. The previous check ran `npm view apple-pim-cli
      # version` in the same job one line later and only ECHOED the result, so
      # on the v3.14.0 run it printed 3.13.0 — the PREVIOUS version — and passed.
      # A publish that genuinely failed to land looked identical.
      #
      # Poll the version-specific registry document instead, which 404s until the
      # tag's version exists, and fail if it never appears. `no-cache` keeps a CDN
      # copy of an earlier 404 from ending the poll early.
      - name: Verify the published version is live on the registry
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          URL="https://registry.npmjs.org/apple-pim-cli/${VERSION}"
          for attempt in $(seq 1 20); do
            if curl -fsS -H 'Cache-Control: no-cache' "$URL" -o manifest.json; then
              PUBLISHED=$(node -p "require('./manifest.json').version")
              if [ "$PUBLISHED" = "$VERSION" ]; then
                echo "apple-pim-cli@$VERSION is live on the registry."
                exit 0
              fi
              echo "::error::Registry served version $PUBLISHED at $URL"
              exit 1
            fi
            echo "Attempt $attempt: $VERSION not on the registry yet; retrying in 15s..."
            sleep 15
          done
          echo "::error::apple-pim-cli@$VERSION never appeared on the registry after 5 minutes"
          exit 1
