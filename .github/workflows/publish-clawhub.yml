name: Publish to ClawHub

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Publishing is gated on the SDK actually shipping what the mail channel calls,
  # because the three publish workflows fire independently on the same tag. Without
  # this, a premature tag fails the two npm-installing workflows and SUCCEEDS on
  # Homebrew, which builds the Swift CLI from the source tarball and never touches
  # openclaw/. That leaves the tap pointing at a version npm and ClawHub never got,
  # which is worse than nothing publishing at all.
  preflight:
    name: SDK contract preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 24

      - name: Probe the OpenClaw SDK contract
        id: sdk
        uses: ./.github/actions/openclaw-sdk-contract

      - name: Refuse to publish against an SDK without the contract
        if: steps.sdk.outputs.available != 'true'
        env:
          DETAIL: ${{ steps.sdk.outputs.detail }}
        run: |
          echo "::error::$DETAIL"
          {
            echo "### Publish blocked"
            echo ""
            echo "\`openclaw/src/mail-channel/inbound.ts\` calls the channel-ingress"
            echo "identifier-authentication contract, and no installable SDK ships it yet."
            echo ""
            echo "> $DETAIL"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Report
        if: steps.sdk.outputs.available == 'true'
        env:
          DETAIL: ${{ steps.sdk.outputs.detail }}
        run: echo "::notice::$DETAIL"

  publish:
    name: Publish to ClawHub
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 22

      - name: Install clawhub CLI
        run: npm install -g clawhub

      - name: Authenticate
        run: clawhub login --token "${{ secrets.CLAWHUB_TOKEN }}" --no-browser

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog from tag annotation
        id: changelog
        run: |
          MSG=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME" 2>/dev/null || true)
          if [ -z "$MSG" ] || [ "$MSG" = "$GITHUB_REF_NAME" ]; then
            MSG=$(git log -1 --format='%s')
          fi
          echo "text=$MSG" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          cd openclaw
          npm install --force

      - name: Resolve lib/ symlink for packaging
        run: |
          cd openclaw
          npm run prepack

      - name: Install + build (compile TS so clawhub validator finds dist/)
        run: |
          cd openclaw
          npm run build

      - name: Sync manifest version to tag (tag is source of truth)
        run: |
          cd openclaw
          V="${{ steps.version.outputs.version }}"
          for f in package.json openclaw.plugin.json .claude-plugin/plugin.json; do
            [ -f "$f" ] || continue
            node -e "const fs=require('fs'),p='$f',j=JSON.parse(fs.readFileSync(p));if('version' in j){j.version='$V';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');console.log('synced '+p+' -> $V')}"
          done

      - name: Publish to ClawHub
        id: publish
        run: |
          set -o pipefail
          clawhub package publish openclaw/ \
            --family code-plugin \
            --name apple-pim-cli \
            --display-name "Apple PIM" \
            --version "${{ steps.version.outputs.version }}" \
            --changelog "${{ steps.changelog.outputs.text }}" \
            --tags "latest" \
            --source-repo "${{ github.repository }}" \
            --source-commit "${{ github.sha }}" \
            --source-ref "${{ github.ref_name }}" 2>&1 | tee publish.log
          # ClawHub holds an update back until its security scans finish, which can take
          # longer than any reasonable wait ("Update submitted for X; pending security
          # scans before it becomes public"). That is an accepted upload, not a failure.
          if grep -qi 'pending security scan' publish.log; then
            echo "pending_scan=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending_scan=false" >> "$GITHUB_OUTPUT"
          fi

      # `clawhub package inspect apple-pim-cli` with no version prints whatever is
      # currently latest and exits 0 either way, so it proved nothing about THIS
      # publish — the same hole the NPM verify step had. Pinning `--version` makes
      # it an assertion: the CLI exits 1 on "Version not found", so the loop ends
      # only when the tag's version is actually resolvable.
      - name: Verify the published version is live on ClawHub
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PENDING_SCAN: ${{ steps.publish.outputs.pending_scan }}
        run: |
          # A direct publish should be live within 5 minutes. One held for security scans
          # gets 15, and if it is still held after that the run passes with a warning: the
          # upload was accepted, and failing would only make a good release look broken.
          ATTEMPTS=20
          [ "$PENDING_SCAN" = "true" ] && ATTEMPTS=60
          for attempt in $(seq 1 "$ATTEMPTS"); do
            if clawhub package inspect apple-pim-cli --version "$VERSION" --json > inspect.json; then
              echo "apple-pim-cli@$VERSION is live on ClawHub."
              exit 0
            fi
            echo "Attempt $attempt/$ATTEMPTS: $VERSION not on ClawHub yet; retrying in 15s..."
            sleep 15
          done
          if [ "$PENDING_SCAN" = "true" ]; then
            echo "::warning::apple-pim-cli@$VERSION was accepted by ClawHub but is still held for security scans. It goes live when they pass; check with: clawhub package inspect apple-pim-cli --version $VERSION"
            {
              echo "### ClawHub: pending security scans"
              echo ""
              echo "\`apple-pim-cli@$VERSION\` was uploaded and is waiting on ClawHub's security scans."
              echo "It becomes public when they pass. Confirm later with:"
              echo ""
              echo "\`\`\`"
              echo "clawhub package inspect apple-pim-cli --version $VERSION"
              echo "\`\`\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::apple-pim-cli@$VERSION never appeared on ClawHub after 5 minutes"
          exit 1
