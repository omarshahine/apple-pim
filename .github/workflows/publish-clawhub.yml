name: Publish to ClawHub

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Publishing is gated on the SDK actually shipping what the mail channel calls,
  # because the three publish workflows fire independently on the same tag. Without
  # this, a premature tag fails the two npm-installing workflows and SUCCEEDS on
  # Homebrew, which builds the Swift CLI from the source tarball and never touches
  # openclaw/. That leaves the tap pointing at a version npm and ClawHub never got,
  # which is worse than nothing publishing at all.
  preflight:
    name: SDK contract preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Probe the OpenClaw SDK contract
        id: sdk
        uses: ./.github/actions/openclaw-sdk-contract

      - name: Refuse to publish against an SDK without the contract
        if: steps.sdk.outputs.available != 'true'
        env:
          DETAIL: ${{ steps.sdk.outputs.detail }}
        run: |
          echo "::error::$DETAIL"
          {
            echo "### Publish blocked"
            echo ""
            echo "\`openclaw/src/mail-channel/inbound.ts\` calls the channel-ingress"
            echo "identifier-authentication contract, and no installable SDK ships it yet."
            echo ""
            echo "> $DETAIL"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Report
        if: steps.sdk.outputs.available == 'true'
        env:
          DETAIL: ${{ steps.sdk.outputs.detail }}
        run: echo "::notice::$DETAIL"

  publish:
    name: Publish to ClawHub
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install clawhub CLI
        run: npm install -g clawhub

      - name: Authenticate
        run: clawhub login --token "${{ secrets.CLAWHUB_TOKEN }}" --no-browser

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog from tag annotation
        id: changelog
        run: |
          MSG=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME" 2>/dev/null || true)
          if [ -z "$MSG" ] || [ "$MSG" = "$GITHUB_REF_NAME" ]; then
            MSG=$(git log -1 --format='%s')
          fi
          echo "text=$MSG" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          cd openclaw
          npm install --force

      - name: Resolve lib/ symlink for packaging
        run: |
          cd openclaw
          npm run prepack

      - name: Install + build (compile TS so clawhub validator finds dist/)
        run: |
          cd openclaw
          npm run build

      - name: Sync manifest version to tag (tag is source of truth)
        run: |
          cd openclaw
          V="${{ steps.version.outputs.version }}"
          for f in package.json openclaw.plugin.json .claude-plugin/plugin.json; do
            [ -f "$f" ] || continue
            node -e "const fs=require('fs'),p='$f',j=JSON.parse(fs.readFileSync(p));if('version' in j){j.version='$V';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');console.log('synced '+p+' -> $V')}"
          done

      - name: Publish to ClawHub
        run: |
          clawhub package publish openclaw/ \
            --family code-plugin \
            --name apple-pim-cli \
            --display-name "Apple PIM" \
            --version "${{ steps.version.outputs.version }}" \
            --changelog "${{ steps.changelog.outputs.text }}" \
            --tags "latest" \
            --source-repo "${{ github.repository }}" \
            --source-commit "${{ github.sha }}" \
            --source-ref "${{ github.ref_name }}"

      # `clawhub package inspect apple-pim-cli` with no version prints whatever is
      # currently latest and exits 0 either way, so it proved nothing about THIS
      # publish — the same hole the NPM verify step had. Pinning `--version` makes
      # it an assertion: the CLI exits 1 on "Version not found", so the loop ends
      # only when the tag's version is actually resolvable.
      - name: Verify the published version is live on ClawHub
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for attempt in $(seq 1 20); do
            if clawhub package inspect apple-pim-cli --version "$VERSION" --json > inspect.json; then
              echo "apple-pim-cli@$VERSION is live on ClawHub."
              exit 0
            fi
            echo "Attempt $attempt: $VERSION not on ClawHub yet; retrying in 15s..."
            sleep 15
          done
          echo "::error::apple-pim-cli@$VERSION never appeared on ClawHub after 5 minutes"
          exit 1
