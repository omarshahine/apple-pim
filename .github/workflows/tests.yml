name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macOS runner minutes bill at 10x the Linux rate, so the two macOS jobs
  # below only run on pull requests (the merge commit re-running them on push
  # to main added nothing) and only when their source paths actually changed.
  # Job-level skips via dorny/paths-filter still satisfy the required checks
  # ("MCP Server (Node)", "Swift CLI") — a workflow-level paths filter would
  # leave them stuck as Expected.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.filter.outputs.node }}
      swift: ${{ steps.filter.outputs.swift }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4
        id: filter
        with:
          filters: |
            node:
              - 'lib/**'
              - 'mcp-server/**'
              - 'package.json'
              - '.github/workflows/tests.yml'
            swift:
              - 'swift/**'
              - '.github/workflows/tests.yml'

  mcp-server-tests:
    name: MCP Server (Node)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.node == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp-server/package.json

      - name: Install root dependencies
        run: npm install --prefix ..

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build MCP server
        run: npm run build

  agent-evals:
    name: Agent Evals
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: 20

      - name: Install root dependencies
        run: npm install

      - name: Install eval dependencies
        run: npm install --prefix evals

      - name: Run agent evals
        run: npm run eval
        env:
          SKIP_MODEL_EVALS: "1"

  swift-cli-tests:
    name: Swift CLI
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.swift == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: swift
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Run Swift tests
        run: swift test

  # openclaw/ defines `"test": "node --test \"src/**/*.test.ts\""`. Those suites cover
  # the mail channel's ingress admission -- allowlist matching, per-message
  # authentication strength, the loop guard, thread permission, and the scenario
  # table that exists to catch drift between the documented rows and the code.
  #
  # The job self-enabled on 2026-08-31 when openclaw@2026.8.1 hit npm -- the first
  # published release that both satisfies the plugin's declared floor and ships the
  # channel-ingress contract. The probe stays: it asserts the capability, not the
  # version, so if a future published SDK regresses the contract this job goes back
  # to skipping loudly instead of failing for the wrong reason.
  #
  # Eligible for required-check promotion once its summary has said "RAN" for a while.
  openclaw-plugin-tests:
    name: OpenClaw Plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          # `node --test` runs .ts directly via type stripping on 22+.
          node-version: 24

      - name: Probe the OpenClaw SDK contract
        id: sdk
        uses: ./.github/actions/openclaw-sdk-contract

      - name: Skip, loudly, while no installable SDK ships the contract
        if: steps.sdk.outputs.available != 'true'
        env:
          DETAIL: ${{ steps.sdk.outputs.detail }}
        run: |
          echo "::notice::openclaw tests skipped -- $DETAIL"
          {
            echo "### OpenClaw plugin tests: SKIPPED"
            echo ""
            echo "> $DETAIL"
            echo ""
            echo "This job proves nothing in this run. It starts running by itself once a"
            echo "published SDK ships the channel-ingress contract."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install root dependencies
        if: steps.sdk.outputs.available == 'true'
        run: npm install

      - name: Install plugin dependencies
        if: steps.sdk.outputs.available == 'true'
        working-directory: openclaw
        # apple-pim-cli declares "os": ["darwin"] (at runtime it spawns the four
        # macOS-only Swift CLIs), so a plain `npm install` refuses to run here with
        # EBADPLATFORM. The test suite itself is pure logic and passes on linux
        # (verified: node:24, 251/251); --force downgrades the platform check to a
        # warning, which keeps this job off 10x-priced macOS runners.
        run: npm install --force

      - name: Run OpenClaw plugin tests
        if: steps.sdk.outputs.available == 'true'
        working-directory: openclaw
        run: npm test

      - name: Record that the suite actually ran
        if: steps.sdk.outputs.available == 'true'
        env:
          VERSION: ${{ steps.sdk.outputs.version }}
        run: |
          echo "### OpenClaw plugin tests: RAN against openclaw@$VERSION" >> "$GITHUB_STEP_SUMMARY"

  version-check:
    name: Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: omarshahine/version-consistency-action@de358297133489498bca32eaea89a296e9e4a5b0  # v1
        with:
          sets: |
            - name: "Apple PIM plugin"
              sources:
                - .claude-plugin/plugin.json:.version
                - .claude-plugin/marketplace.json:.plugins[0].version
                - mcp-server/package.json:.version
                - openclaw/package.json:.version
                - openclaw/openclaw.plugin.json:.version
